<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="50%" stop-color="#0E2D4A"/>
      <stop offset="100%" stop-color="#07121E"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7B3A99"/>
    </linearGradient>
    <radialGradient id="satelliteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#tealGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radar / Sensing Grids -->
  <circle cx="256" cy="256" r="180" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="80" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Satellite Orbit Arc -->
  <path d="M 80 340 A 210 170 -25 0 1 432 172" stroke="url(#saffronGrad)" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round"/>
  
  <!-- Geospatial Eye (Netra) Contour -->
  <path d="M 96 256 C 150 160 362 160 416 256 C 362 352 150 352 96 256 Z" fill="#0A1E30" stroke="url(#tealGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Watershed Terrain Waves inside the Netra -->
  <path d="M 120 270 Q 180 230 256 260 T 392 250" stroke="#0EA5E9" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 130 290 Q 200 260 256 280 T 382 270" stroke="#10B981" stroke-width="4" fill="none" opacity="0.8"/>
  
  <!-- Central Sensing Iris / Check Dam & Lake -->
  <circle cx="256" cy="256" r="64" fill="url(#satelliteGlow)"/>
  <circle cx="256" cy="256" r="50" fill="#064E3B" stroke="url(#tealGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="26" fill="#0F766E"/>
  <circle cx="256" cy="256" r="12" fill="#34D399"/>

  <!-- Satellite sensor symbol top right -->
  <g transform="translate(420, 160) rotate(-35)">
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="#F59E0B"/>
    <rect x="-30" y="-5" width="12" height="10" rx="2" fill="#38BDF8"/>
    <rect x="18" y="-5" width="12" height="10" rx="2" fill="#38BDF8"/>
    <line x1="0" y1="8" x2="0" y2="16" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="18" r="3" fill="#EF4444"/>
  </g>

  <!-- Crosshair coordinates marks -->
  <line x1="256" y1="90" x2="256" y2="110" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="402" x2="256" y2="422" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="256" x2="110" y2="256" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="402" y1="256" x2="422" y2="256" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
</svg>
